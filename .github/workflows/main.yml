name: CRYPTO-BOT Scan

on:
  workflow_dispatch:               # 🔹 הפעלה ידנית מכפתור
  schedule:
    - cron: '0 * * * *'            # 🔹 כל שעה עגולה (00:00, 01:00, ...)

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # ================================================================
      #  🔍 DEBUG – בודק את get_candles ו-get_ticker_24h
      # ================================================================
      - name: 🔍 Debug - get_candles for BTCUSDT
        run: |
          echo "=== 1. Testing get_candles (KuCoin + Binance) ==="
          python -c "
          from scanner.market_data import get_candles
          print('get_candles(\"BTCUSDT\", \"5min\", limit=10):')
          df = get_candles('BTCUSDT', '5min', limit=10)
          if df is not None:
              print(f'✅ Got {len(df)} candles')
              print(df[['open_time', 'open', 'close']].tail())
          else:
              print('❌ get_candles returned None')
          "

          echo ""
          echo "=== 2. Testing get_ticker_24h (KuCoin + Binance) ==="
          python -c "
          from scanner.market_data import get_ticker_24h
          print('get_ticker_24h(\"BTCUSDT\"):')
          ticker = get_ticker_24h('BTCUSDT')
          if ticker:
              print(f'✅ Got ticker: quoteVolume={ticker.get(\"quoteVolume\")}')
          else:
              print('❌ get_ticker_24h returned None')
          "

          echo ""
          echo "=== 3. Direct KuCoin API (curl) ==="
          curl -s "https://api.kucoin.com/api/v1/market/stats?symbol=BTC-USDT" | head -100

      # ================================================================
      #  RUN SCAN
      # ================================================================
      - name: Run scan (main pipeline)
        run: python main.py --once
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DB_PATH: ${{ secrets.DB_PATH || 'data/shadow.db' }}

      # ================================================================
      #  PHASE 1 – DATA PROVENANCE AUDIT
      # ================================================================
      - name: Audit pnl_pct_method
        env:
          DB_PATH: ${{ secrets.DB_PATH || 'data/shadow.db' }}
        run: |
          python -c "
          import sqlite3, os
          DB_PATH = os.getenv('DB_PATH', 'data/shadow.db')
          conn = sqlite3.connect(DB_PATH)
          cur = conn.cursor()
          cur.execute('''
              SELECT
                  COALESCE(pnl_pct_method, 'NULL') AS method,
                  COUNT(*) AS n
              FROM shadow_trades
              WHERE decision='BUY'
                AND outcome_status='FINAL'
                AND outcome_checked=1
              GROUP BY pnl_pct_method
              ORDER BY n DESC
          ''')
          print('===== Audit: pnl_pct_method =====')
          for row in cur.fetchall():
              print(f'{row[0]:25} : {row[1]}')
          conn.close()
          "

      - name: Audit V8 fields (pnl_r, mfe_r, mae_r, outcome_type)
        env:
          DB_PATH: ${{ secrets.DB_PATH || 'data/shadow.db' }}
        run: |
          python -c "
          import sqlite3, os
          DB_PATH = os.getenv('DB_PATH', 'data/shadow.db')
          conn = sqlite3.connect(DB_PATH)
          cur = conn.cursor()
          cur.execute('''
              SELECT
                  COUNT(*) AS total,
                  SUM(CASE WHEN pnl_r IS NOT NULL THEN 1 ELSE 0 END) AS has_pnl_r,
                  SUM(CASE WHEN mfe_r IS NOT NULL THEN 1 ELSE 0 END) AS has_mfe_r,
                  SUM(CASE WHEN mae_r IS NOT NULL THEN 1 ELSE 0 END) AS has_mae_r,
                  SUM(CASE WHEN first_outcome_type IS NOT NULL THEN 1 ELSE 0 END) AS has_outcome_type
              FROM shadow_trades
              WHERE decision='BUY'
                AND outcome_status='FINAL'
                AND outcome_checked=1
          ''')
          row = cur.fetchone()
          print('===== Audit: V8-derived fields =====')
          print(f'Total FINAL: {row[0]}')
          if row[0] > 0:
              print(f'  with pnl_r: {row[1]} ({row[1]*100/row[0]:.1f}%)')
              print(f'  with mfe_r: {row[2]} ({row[2]*100/row[0]:.1f}%)')
              print(f'  with mae_r: {row[3]} ({row[3]*100/row[0]:.1f}%)')
              print(f'  with first_outcome_type: {row[4]} ({row[4]*100/row[0]:.1f}%)')
          else:
              print('  with pnl_r: 0')
              print('  with mfe_r: 0')
              print('  with mae_r: 0')
              print('  with first_outcome_type: 0')
          conn.close()
          "

      - name: Reconcile DB vs CSV
        env:
          DB_PATH: ${{ secrets.DB_PATH || 'data/shadow.db' }}
        run: |
          python -c "
          import sqlite3, os, pandas as pd
          DB_PATH = os.getenv('DB_PATH', 'data/shadow.db')
          conn = sqlite3.connect(DB_PATH)
          cur = conn.cursor()
          cur.execute('''
              SELECT id, symbol FROM shadow_trades
              WHERE decision='BUY'
                AND outcome_status='FINAL'
                AND outcome_checked=1
          ''')
          db_rows = [(r[0], r[1]) for r in cur.fetchall()]
          conn.close()
          db_ids = [r[0] for r in db_rows]

          try:
              df = pd.read_csv('shadow_results.csv')
              csv_symbols = set(df[df['Decision']=='BUY']['Coin'].astype(str).str.replace('USDT', '').tolist())
          except:
              csv_symbols = set()

          db_symbols = set([r[1].replace('USDT', '') for r in db_rows])

          print('===== Reconciliation: DB FINAL vs CSV BUY =====')
          print(f'DB FINAL count: {len(db_ids)}')
          print(f'CSV BUY count:  {len(csv_symbols)}')
          print(f'In DB but not CSV: {db_symbols - csv_symbols}')
          print(f'In CSV but not DB: {csv_symbols - db_symbols}')
          "

      # ================================================================
      #  PHASE 2 – LEGACY REBUILD
      # ================================================================
      - name: Reset legacy FINAL trades (if any)
        env:
          DB_PATH: ${{ secrets.DB_PATH || 'data/shadow.db' }}
        run: |
          python -c "
          from tools.reset_legacy_finals import reset_legacy_finals
          reset_legacy_finals()
          "

      - name: Re-run outcome tracker (after reset)
        env:
          DB_PATH: ${{ secrets.DB_PATH || 'data/shadow.db' }}
        run: |
          python -c "from tools.outcome_tracker import update_outcomes; print(update_outcomes())"

      - name: Re-export ML dataset
        env:
          DB_PATH: ${{ secrets.DB_PATH || 'data/shadow.db' }}
        run: |
          python -c "from tools.export_learning_dataset import export_ml_dataset; export_ml_dataset()"

      - name: Re-run dashboard (after rebuild)
        env:
          DB_PATH: ${{ secrets.DB_PATH || 'data/shadow.db' }}
        run: |
          python -c "from tools.learning_dashboard import run_dashboard; print(run_dashboard())"

      # ================================================================
      #  PHASE 3 – ARTIFACTS
      # ================================================================
      - name: Upload shadow results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-results
          path: |
            shadow_results.csv
            data/learning_dataset.csv

      - name: Upload dashboard output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-output
          path: |
            analysis_report.txt
            shadow_results.csv