name: CRYPTO-BOT Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # ================================================================
      # 🔍 DB STATUS CHECK – בדיקה לפני הריצה
      # ================================================================
      - name: 🔍 DB Status Check (Before)
        env:
          DB_PATH: ${{ secrets.DB_PATH || 'data/shadow.db' }}
        run: |
          python -c "
          import sqlite3, os
          DB_PATH = os.getenv('DB_PATH', 'data/shadow.db')
          print(f'DB_PATH: {DB_PATH}')
          print(f'DB exists: {os.path.exists(DB_PATH)}')
          if not os.path.exists(DB_PATH):
              print('❌ DB not found – starting fresh')
          else:
              conn = sqlite3.connect(DB_PATH)
              cur = conn.cursor()
              print()
              print('=== Status Breakdown ===')
              cur.execute('SELECT outcome_status, COUNT(*) FROM shadow_trades GROUP BY outcome_status')
              for row in cur.fetchall():
                  print(f'  {row[0]}: {row[1]}')
              print()
              cur.execute('SELECT COUNT(*) FROM shadow_trades')
              total = cur.fetchone()[0]
              print(f'  TOTAL: {total}')
              print()
              print('=== Last 10 trades ===')
              cur.execute('SELECT id, symbol, ts, outcome_status FROM shadow_trades ORDER BY id DESC LIMIT 10')
              for row in cur.fetchall():
                  print(f'  ID={row[0]} | {row[1]} | {row[2]} | {row[3]}')
              conn.close()
          "

      # ================================================================
      # 🔍 HEALTH CHECK
      # ================================================================
      - name: 🔍 Market Data Health Check
        run: |
          python -c "from tools.health_check import health_check; health_check()"

      # ================================================================
      # 🔍 DEBUG CANDLES
      # ================================================================
      - name: 🔍 Debug Candles for Open Trades
        env:
          DB_PATH: ${{ secrets.DB_PATH || 'data/shadow.db' }}
        run: |
          python -c "
          import sqlite3, os, time
          from scanner.market_data import get_candles
          conn = sqlite3.connect(os.getenv('DB_PATH', 'data/shadow.db'))
          cur = conn.cursor()
          symbols = [r[0] for r in cur.execute('''
              SELECT DISTINCT symbol FROM shadow_trades
              WHERE outcome_status IN ('PENDING', 'ACTIVE')
          ''').fetchall()]
          conn.close()
          print(f'Total open trade symbols: {len(symbols)}')
          success = 0
          failed = 0
          for i, sym in enumerate(symbols[:10], 1):
              df = get_candles(sym, '5m', limit=10)
              n = len(df) if df is not None else 0
              print(f'{i}. {sym}: {n} candles')
              if n > 0: success += 1
              else: failed += 1
              time.sleep(0.5)
          print(f'Success: {success}/10, Failed: {failed}/10')
          "

      # ================================================================
      # RUN SCAN
      # ================================================================
      - name: Run scan (main pipeline)
        run: python main.py --once
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DB_PATH: ${{ secrets.DB_PATH || 'data/shadow.db' }}

      # ================================================================
      # 🔍 DB STATUS CHECK – אחרי הריצה
      # ================================================================
      - name: 🔍 DB Status Check (After)
        env:
          DB_PATH: ${{ secrets.DB_PATH || 'data/shadow.db' }}
        run: |
          python -c "
          import sqlite3, os
          DB_PATH = os.getenv('DB_PATH', 'data/shadow.db')
          conn = sqlite3.connect(DB_PATH)
          cur = conn.cursor()
          print('=== Status Breakdown (After) ===')
          cur.execute('SELECT outcome_status, COUNT(*) FROM shadow_trades GROUP BY outcome_status')
          for row in cur.fetchall():
              print(f'  {row[0]}: {row[1]}')
          print()
          cur.execute('SELECT COUNT(*) FROM shadow_trades')
          total = cur.fetchone()[0]
          print(f'  TOTAL: {total}')
          print()
          print('=== Trades from today ===')
          cur.execute('''
              SELECT id, symbol, ts, outcome_status 
              FROM shadow_trades 
              WHERE ts >= datetime('now', '-1 day')
              ORDER BY id DESC LIMIT 20
          ''')
          for row in cur.fetchall():
              print(f'  ID={row[0]} | {row[1]} | {row[2]} | {row[3]}')
          conn.close()
          "

      # ================================================================
      # 🔬 EDGE AUDIT
      # ================================================================
      - name: 🔬 Edge Audit (full statistical analysis)
        env:
          DB_PATH: ${{ secrets.DB_PATH || 'data/shadow.db' }}
        run: |
          python -c "from tools.edge_audit import run_edge_audit; run_edge_audit()"

      # ================================================================
      #  PHASE 1 – DATA PROVENANCE AUDIT
      # ================================================================
      - name: Audit pnl_pct_method
        env:
          DB_PATH: ${{ secrets.DB_PATH || 'data/shadow.db' }}
        run: |
          python -c "
          import sqlite3, os
          DB_PATH = os.getenv('DB_PATH', 'data/shadow.db')
          conn = sqlite3.connect(DB_PATH)
          cur = conn.cursor()
          cur.execute('''
              SELECT COALESCE(pnl_pct_method, 'NULL') AS method, COUNT(*) AS n
              FROM shadow_trades
              WHERE decision='BUY' AND outcome_status='FINAL' AND outcome_checked=1
              GROUP BY pnl_pct_method ORDER BY n DESC
          ''')
          print('===== Audit: pnl_pct_method =====')
          for row in cur.fetchall():
              print(f'{row[0]:25} : {row[1]}')
          conn.close()
          "

      - name: Audit V8 fields
        env:
          DB_PATH: ${{ secrets.DB_PATH || 'data/shadow.db' }}
        run: |
          python -c "
          import sqlite3, os
          DB_PATH = os.getenv('DB_PATH', 'data/shadow.db')
          conn = sqlite3.connect(DB_PATH)
          cur = conn.cursor()
          cur.execute('''
              SELECT COUNT(*) AS total,
                  SUM(CASE WHEN pnl_r IS NOT NULL THEN 1 ELSE 0 END) AS has_pnl_r,
                  SUM(CASE WHEN mfe_r IS NOT NULL THEN 1 ELSE 0 END) AS has_mfe_r,
                  SUM(CASE WHEN mae_r IS NOT NULL THEN 1 ELSE 0 END) AS has_mae_r,
                  SUM(CASE WHEN first_outcome_type IS NOT NULL THEN 1 ELSE 0 END) AS has_outcome_type
              FROM shadow_trades
              WHERE decision='BUY' AND outcome_status='FINAL' AND outcome_checked=1
          ''')
          row = cur.fetchone()
          print('===== Audit: V8-derived fields =====')
          print(f'Total FINAL: {row[0]}')
          if row[0] > 0:
              print(f'  with pnl_r: {row[1]} ({row[1]*100/row[0]:.1f}%)')
              print(f'  with mfe_r: {row[2]} ({row[2]*100/row[0]:.1f}%)')
              print(f'  with mae_r: {row[3]} ({row[3]*100/row[0]:.1f}%)')
              print(f'  with first_outcome_type: {row[4]} ({row[4]*100/row[0]:.1f}%)')
          conn.close()
          "

      - name: Reconcile DB vs CSV
        env:
          DB_PATH: ${{ secrets.DB_PATH || 'data/shadow.db' }}
        run: |
          python -c "
          import sqlite3, os, pandas as pd
          DB_PATH = os.getenv('DB_PATH', 'data/shadow.db')
          conn = sqlite3.connect(DB_PATH)
          cur = conn.cursor()
          cur.execute('''
              SELECT id, symbol FROM shadow_trades
              WHERE decision='BUY' AND outcome_status='FINAL' AND outcome_checked=1
          ''')
          db_rows = [(r[0], r[1]) for r in cur.fetchall()]
          conn.close()
          db_ids = [r[0] for r in db_rows]
          try:
              df = pd.read_csv('shadow_results.csv')
              csv_symbols = set(df[df['Decision']=='BUY']['Coin'].astype(str).str.replace('USDT', '').tolist())
          except:
              csv_symbols = set()
          db_symbols = set([r[1].replace('USDT', '') for r in db_rows])
          print('===== Reconciliation =====')
          print(f'DB FINAL count: {len(db_ids)}')
          print(f'CSV BUY count:  {len(csv_symbols)}')
          print(f'In DB but not CSV: {len(db_symbols - csv_symbols)}')
          print(f'In CSV but not DB: {len(csv_symbols - db_symbols)}')
          "

      # ================================================================
      #  PHASE 2 – LEGACY REBUILD
      # ================================================================
      - name: Reset legacy FINAL trades (if any)
        env:
          DB_PATH: ${{ secrets.DB_PATH || 'data/shadow.db' }}
        run: |
          python -c "from tools.reset_legacy_finals import reset_legacy_finals; reset_legacy_finals()"

      - name: Re-run outcome tracker
        env:
          DB_PATH: ${{ secrets.DB_PATH || 'data/shadow.db' }}
        run: |
          python -c "from tools.outcome_tracker import update_outcomes; print(update_outcomes())"

      - name: Re-export ML dataset
        env:
          DB_PATH: ${{ secrets.DB_PATH || 'data/shadow.db' }}
        run: |
          python -c "from tools.export_learning_dataset import export_ml_dataset; export_ml_dataset()"

      - name: Re-run dashboard
        env:
          DB_PATH: ${{ secrets.DB_PATH || 'data/shadow.db' }}
        run: |
          python -c "from tools.learning_dashboard import run_dashboard; print(run_dashboard())"

      # ================================================================
      # 💾 COMMIT + PUSH – שמירת ה‑DB וה‑CSV ל‑git
      # ================================================================
      - name: 💾 Commit updated DB and results
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Add all data files
          git add -f data/shadow.db || echo "DB not found"
          git add shadow_results.csv || echo "CSV not found"
          git add data/learning_dataset.csv || echo "Dataset not found"
          git add analysis_report.txt || echo "Report not found"
          
          # Check if there's anything to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📈 Auto-update shadow results [skip ci]"
            git push
            echo "✅ DB + results pushed to git"
          fi

      # ================================================================
      #  ARTIFACTS
      # ================================================================
      - name: Upload shadow results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-results
          path: |
            shadow_results.csv
            data/learning_dataset.csv
            data/shadow.db

      - name: Upload dashboard output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-output
          path: |
            analysis_report.txt
            shadow_results.csv
