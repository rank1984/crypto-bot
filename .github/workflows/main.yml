name: CRYPTO-BOT Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      # ================================================================
      # CHECKOUT
      # ================================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # ================================================================
      # DB STATUS CHECK – לפני הריצה
      # ================================================================
      - name: 🔍 DB Status Check (Before)
        env:
          DB_PATH: ${{ secrets.DB_PATH || 'data/shadow.db' }}
        run: |
          python -c "
          import sqlite3, os
          DB_PATH = os.getenv('DB_PATH', 'data/shadow.db')
          print(f'DB_PATH: {DB_PATH}')
          print(f'DB exists: {os.path.exists(DB_PATH)}')
          if not os.path.exists(DB_PATH):
              print('❌ DB not found – starting fresh')
          else:
              conn = sqlite3.connect(DB_PATH)
              cur = conn.cursor()
              print()
              print('=== Status Breakdown ===')
              cur.execute('SELECT outcome_status, COUNT(*) FROM shadow_trades GROUP BY outcome_status')
              for row in cur.fetchall():
                  print(f'  {row[0]}: {row[1]}')
              print()
              cur.execute('SELECT COUNT(*) FROM shadow_trades')
              total = cur.fetchone()[0]
              print(f'  TOTAL: {total}')
              print()
              print('=== Last 10 trades ===')
              cur.execute('SELECT id, symbol, ts, outcome_status FROM shadow_trades ORDER BY id DESC LIMIT 10')
              for row in cur.fetchall():
                  print(f'  ID={row[0]} | {row[1]} | {row[2]} | {row[3]}')
              print()
              cur.execute(\"SELECT COUNT(*) FROM shadow_trades WHERE ts >= date('now', '-1 day')\")
              print(f'Trades today: {cur.fetchone()[0]}')
              cur.execute('SELECT MAX(ts) FROM shadow_trades')
              print(f'Latest trade: {cur.fetchone()[0]}')
              conn.close()
          "

      # ================================================================
      # HEALTH CHECK
      # ================================================================
      - name: 🔍 Market Data Health Check
        run: |
          python -c "from tools.health_check import health_check; health_check()"

      # ================================================================
      # DEBUG CANDLES
      # ================================================================
      - name: 🔍 Debug Candles for Open Trades
        env:
          DB_PATH: ${{ secrets.DB_PATH || 'data/shadow.db' }}
        run: |
          python -c "
          import sqlite3, os, time
          from scanner.market_data import get_candles
          conn = sqlite3.connect(os.getenv('DB_PATH', 'data/shadow.db'))
          cur = conn.cursor()
          symbols = [r[0] for r in cur.execute('''
              SELECT DISTINCT symbol FROM shadow_trades
              WHERE outcome_status IN ('PENDING', 'ACTIVE')
          ''').fetchall()]
          conn.close()
          print(f'Total open trade symbols: {len(symbols)}')
          success = 0
          failed = 0
          for i, sym in enumerate(symbols[:10], 1):
              df = get_candles(sym, '5m', limit=10)
              n = len(df) if df is not None else 0
              print(f'{i}. {sym}: {n} candles')
              if n > 0: success += 1
              else: failed += 1
              time.sleep(0.5)
          print(f'Success: {success}/10, Failed: {failed}/10')
          "

      # ================================================================
      # RUN SCAN  (main.py handles pruning, tracking, export internally)
      # ================================================================
      - name: Run scan (main pipeline)
        run: python main.py --once
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DB_PATH: ${{ secrets.DB_PATH || 'data/shadow.db' }}
          CANDLE_CACHE_PATH: data/candle_cache.db
          SILENT_MODE: "true"
          MIN_STOP_PCT: "0.012"
          MIN_TP_PCT: "0.024"
          MIN_RR_RATIO: "1.6"
          ADVISOR_AI_MIN: "20"
          ADVISOR_AI_MAX: "40"

      # ================================================================
      # DB STATUS CHECK – אחרי הריצה
      # ================================================================
      - name: 🔍 DB Status Check (After)
        env:
          DB_PATH: ${{ secrets.DB_PATH || 'data/shadow.db' }}
        run: |
          python -c "
          import sqlite3, os
          DB_PATH = os.getenv('DB_PATH', 'data/shadow.db')
          conn = sqlite3.connect(DB_PATH)
          cur = conn.cursor()
          print('=== Status Breakdown (After) ===')
          cur.execute('SELECT outcome_status, COUNT(*) FROM shadow_trades GROUP BY outcome_status')
          for row in cur.fetchall():
              print(f'  {row[0]}: {row[1]}')
          print()
          cur.execute('SELECT COUNT(*) FROM shadow_trades')
          total = cur.fetchone()[0]
          print(f'  TOTAL: {total}')
          print()
          print('=== Trades from today ===')
          cur.execute('''
              SELECT id, symbol, ts, outcome_status 
              FROM shadow_trades 
              WHERE ts >= datetime('now', '-1 day')
              ORDER BY id DESC LIMIT 20
          ''')
          rows = cur.fetchall()
          if not rows:
              print('  (none)')
          for row in rows:
              print(f'  ID={row[0]} | {row[1]} | {row[2]} | {row[3]}')
          conn.close()
          "

      # ================================================================
      # EDGE AUDIT
      # ================================================================
      - name: 🔬 Edge Audit (full statistical analysis)
        env:
          DB_PATH: ${{ secrets.DB_PATH || 'data/shadow.db' }}
        run: |
          python -c "from tools.edge_audit import run_edge_audit; run_edge_audit()"

      # ================================================================
      # PHASE 1 – DATA PROVENANCE AUDIT (read-only diagnostics)
      # ================================================================
      - name: Audit pnl_pct_method
        env:
          DB_PATH: ${{ secrets.DB_PATH || 'data/shadow.db' }}
        run: |
          python -c "
          import sqlite3, os
          DB_PATH = os.getenv('DB_PATH', 'data/shadow.db')
          conn = sqlite3.connect(DB_PATH)
          cur = conn.cursor()
          cur.execute('''
              SELECT COALESCE(pnl_pct_method, 'NULL') AS method, COUNT(*) AS n
              FROM shadow_trades
              WHERE decision='BUY' AND outcome_status='FINAL' AND outcome_checked=1
              GROUP BY pnl_pct_method ORDER BY n DESC
          ''')
          print('===== Audit: pnl_pct_method =====')
          for row in cur.fetchall():
              print(f'{row[0]:25} : {row[1]}')
          conn.close()
          "

      - name: Audit v9.0 fields
        env:
          DB_PATH: ${{ secrets.DB_PATH || 'data/shadow.db' }}
        run: |
          python -c "
          import sqlite3, os
          DB_PATH = os.getenv('DB_PATH', 'data/shadow.db')
          conn = sqlite3.connect(DB_PATH)
          cur = conn.cursor()
          cur.execute('''
              SELECT COUNT(*) AS total,
                  SUM(CASE WHEN pnl_r IS NOT NULL THEN 1 ELSE 0 END) AS has_pnl_r,
                  SUM(CASE WHEN pnl_r_net IS NOT NULL THEN 1 ELSE 0 END) AS has_pnl_r_net,
                  SUM(CASE WHEN final_exit_price > 0 THEN 1 ELSE 0 END) AS has_exit_price,
                  SUM(CASE WHEN realized_pnl_pct IS NOT NULL THEN 1 ELSE 0 END) AS has_realized,
                  SUM(CASE WHEN sl_type_at_exit IS NOT NULL AND sl_type_at_exit != 'N/A' THEN 1 ELSE 0 END) AS has_sl_type
              FROM shadow_trades
              WHERE decision='BUY' AND outcome_status='FINAL' AND outcome_checked=1
          ''')
          row = cur.fetchone()
          print('===== Audit: v9.0-derived fields =====')
          print(f'Total FINAL: {row[0]}')
          if row[0] > 0:
              print(f'  with pnl_r:          {row[1]} ({row[1]*100/row[0]:.1f}%)')
              print(f'  with pnl_r_net:      {row[2]} ({row[2]*100/row[0]:.1f}%)')
              print(f'  with final_exit:     {row[3]} ({row[3]*100/row[0]:.1f}%)')
              print(f'  with realized_pnl:   {row[4]} ({row[4]*100/row[0]:.1f}%)')
              print(f'  with sl_type:        {row[5]} ({row[5]*100/row[0]:.1f}%)')
          conn.close()
          "

      - name: Bucket summary (AI range)
        env:
          DB_PATH: ${{ secrets.DB_PATH || 'data/shadow.db' }}
        run: |
          python -c "
          import sqlite3, os
          DB_PATH = os.getenv('DB_PATH', 'data/shadow.db')
          conn = sqlite3.connect(DB_PATH)
          cur = conn.cursor()
          cur.execute('''
              SELECT ai_bucket, COUNT(*),
                     ROUND(AVG(pnl_r), 3),
                     ROUND(AVG(pnl_r_net), 3),
                     ROUND(SUM(CASE WHEN pnl_r_net>0 THEN 1 ELSE 0 END)*100.0/COUNT(*), 1)
              FROM shadow_trades
              WHERE outcome_status='FINAL' AND decision='BUY'
              GROUP BY ai_bucket ORDER BY ai_bucket
          ''')
          print('===== AI Bucket Summary =====')
          print(f'{\"bucket\":12s} {\"n\":>4s} {\"avg_r\":>8s} {\"avg_r_net\":>10s} {\"win%\":>6s}')
          for row in cur.fetchall():
              print(f'{row[0]:12s} {row[1]:>4d} {row[2] if row[2] is not None else 0:>8.3f} {row[3] if row[3] is not None else 0:>10.3f} {row[4] if row[4] is not None else 0:>6.1f}')
          conn.close()
          "

      # ================================================================
      # COMMIT + PUSH – שמירת ה-DB וה-CSV ל-git
      # ================================================================
      - name: 💾 Commit updated DB and results
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add -f data/shadow.db 2>/dev/null || echo "⚠️ DB not found"
          git add shadow_results.csv 2>/dev/null || echo "⚠️ CSV not found"
          git add data/learning_dataset.csv 2>/dev/null || echo "⚠️ Dataset not found"
          git add analysis_report.txt 2>/dev/null || echo "⚠️ Report not found"

          if git diff --staged --quiet; then
            echo "ℹ️ No changes to commit"
          else
            git commit -m "📈 Auto-update shadow results [skip ci]"
            echo "✅ Committed changes"
            
            if git push; then
              echo "✅ Pushed to remote successfully"
            else
              echo "❌ Push failed – check permissions (need contents: write or PAT_TOKEN)"
              exit 1
            fi
          fi

      # ================================================================
      # ARTIFACTS
      # ================================================================
      - name: Upload shadow results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-results
          path: |
            shadow_results.csv
            data/learning_dataset.csv
            data/shadow.db

      - name: Upload dashboard output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-output
          path: |
            analysis_report.txt
            shadow_results.csv
