name: CRYPTO-BOT Scan

on:
  workflow_dispatch:               # 🔹 הפעלה ידנית מכפתור
  schedule:
    - cron: '0 * * * *'            # 🔹 כל שעה עגולה (00:00, 01:00, ...)

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run scan
        run: python main.py --once
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DB_PATH: ${{ secrets.DB_PATH }}
          # אם יש משתנים נוספים – הוסף אותם כאן

      - name: Upload shadow results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-results
          path: |
            shadow_results.csv
            data/learning_dataset.csv
            analysis_report.txt

      - name: Upload dashboard output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-output
          path: |
            analysis_report.txt
            shadow_results.csv
