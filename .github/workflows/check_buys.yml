name: Check Today's BUYs

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Check
        run: |
          python -c "
          import sqlite3
          conn = sqlite3.connect('data/shadow.db')
          conn.row_factory = sqlite3.Row
          print('=== All BUY statuses ===')
          for r in conn.execute('SELECT outcome_status, COUNT(*) as n FROM shadow_trades WHERE decision=\"BUY\" GROUP BY outcome_status'):
              print(f'  {r[\"outcome_status\"]}: {r[\"n\"]}')
          print()
          print('=== Last 15 BUY ===')
          for r in conn.execute('SELECT id, symbol, ts, setup, outcome_status, ai_score FROM shadow_trades WHERE decision=\"BUY\" ORDER BY id DESC LIMIT 15'):
              print(f'  id={r[\"id\"]:4d} | {r[\"symbol\"]:12s} | {r[\"outcome_status\"]:8s} | setup={str(r[\"setup\"]):12s} | ai={r[\"ai_score\"]:.1f} | {r[\"ts\"][:16]}')
          print()
          print('=== By setup ===')
          for r in conn.execute('SELECT setup, COUNT(*) as n FROM shadow_trades WHERE decision=\"BUY\" GROUP BY setup'):
              print(f'  {r[\"setup\"]}: {r[\"n\"]}')
          conn.close()
          "
