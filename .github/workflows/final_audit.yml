name: 📊 7-Day Stress Test Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install pandas requests 2>/dev/null || true
      - name: Run audit
        run: |
          python -c "
          import sqlite3, os
          DB = os.getenv('DB_PATH', 'data/shadow.db')
          conn = sqlite3.connect(DB)
          conn.row_factory = sqlite3.Row
          
          print('='*70)
          print('  7-DAY STRESS TEST — FINAL REPORT')
          print('='*70)
          
          # Overall (last 7 days)
          print()
          print('--- OVERALL (last 7 days) ---')
          r = conn.execute('''
              SELECT 
                  COUNT(*) as n,
                  SUM(CASE WHEN pnl_pct > 0 THEN 1 ELSE 0 END) as wins,
                  AVG(pnl_r) as avg_r,
                  AVG(pnl_pct) as avg_pnl,
                  AVG(CASE WHEN outcome_tp1_hit=1 THEN 1.0 ELSE 0.0 END) as tp1_rate,
                  AVG(CASE WHEN outcome_sl_hit=1 THEN 1.0 ELSE 0.0 END) as sl_rate,
                  AVG(outcome_mfe) as mfe,
                  AVG(outcome_mae) as mae
              FROM shadow_trades
              WHERE decision='BUY' 
                AND outcome_status='FINAL'
                AND ts >= datetime('now', '-7 days')
          ''').fetchone()
          
          if r['n'] and r['n'] > 0:
              print(f'  N:       {r[\"n\"]}')
              print(f'  Wins:    {r[\"wins\"]} ({r[\"wins\"]*100.0/r[\"n\"]:.1f}%)')
              print(f'  Avg R:   {r[\"avg_r\"]:.3f}')
              print(f'  Avg PnL: {r[\"avg_pnl\"]:.2f}%')
              print(f'  TP1:     {r[\"tp1_rate\"]*100:.1f}%')
              print(f'  SL:      {r[\"sl_rate\"]*100:.1f}%')
              print(f'  MFE:     {r[\"mfe\"]:.2f}%')
              print(f'  MAE:     {r[\"mae\"]:.2f}%')
          else:
              print('  No FINAL trades in last 7 days')
          
          # By AI bucket
          print()
          print('--- BY AI BUCKET ---')
          rows = conn.execute('''
              SELECT 
                  CASE 
                      WHEN ai_score < 20 THEN 'AI_0_20'
                      WHEN ai_score < 40 THEN 'AI_20_40'
                      WHEN ai_score < 60 THEN 'AI_40_60'
                      WHEN ai_score < 80 THEN 'AI_60_80'
                      ELSE 'AI_80_100'
                  END as bucket,
                  COUNT(*) as n,
                  AVG(pnl_r) as avg_r,
                  AVG(CASE WHEN outcome_tp1_hit=1 THEN 1.0 ELSE 0.0 END) as tp1
              FROM shadow_trades
              WHERE decision='BUY' AND outcome_status='FINAL'
                AND ts >= datetime('now', '-7 days')
              GROUP BY bucket ORDER BY bucket
          ''').fetchall()
          for row in rows:
              print(f'  {row[\"bucket\"]:12s}: n={row[\"n\"]:3d}  AvgR={row[\"avg_r\"]:+.3f}  TP1={row[\"tp1\"]*100:.1f}%')
          
          # By setup
          print()
          print('--- BY SETUP ---')
          rows = conn.execute('''
              SELECT setup, COUNT(*) as n, AVG(pnl_r) as avg_r,
                     AVG(CASE WHEN outcome_tp1_hit=1 THEN 1.0 ELSE 0.0 END) as tp1
              FROM shadow_trades
              WHERE decision='BUY' AND outcome_status='FINAL'
                AND ts >= datetime('now', '-7 days')
              GROUP BY setup ORDER BY n DESC
          ''').fetchall()
          for row in rows:
              print(f'  {str(row[\"setup\"]):15s}: n={row[\"n\"]:3d}  AvgR={row[\"avg_r\"]:+.3f}  TP1={row[\"tp1\"]*100:.1f}%')
          
          # PENDING count
          print()
          print('--- CURRENT STATE ---')
          r = conn.execute('''
              SELECT 
                  SUM(CASE WHEN outcome_status='PENDING' THEN 1 ELSE 0 END) as pending,
                  SUM(CASE WHEN outcome_status='ACTIVE' THEN 1 ELSE 0 END) as active,
                  SUM(CASE WHEN outcome_status='FINAL' THEN 1 ELSE 0 END) as final
              FROM shadow_trades WHERE decision='BUY'
          ''').fetchone()
          print(f'  PENDING: {r[\"pending\"]}')
          print(f'  ACTIVE:  {r[\"active\"]}')
          print(f'  FINAL:   {r[\"final\"]}')
          print()
          print('='*70)
          conn.close()
          "