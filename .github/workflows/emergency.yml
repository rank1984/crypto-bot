name: 🚨 Emergency Audit & Cleanup

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'What to do'
        required: true
        default: 'diagnose'
        type: choice
        options:
          - diagnose
          - cleanup
          - dip_check
          - multiday_check
          - all

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pandas requests
          fi

      - name: Show DB size before
        run: ls -lh data/shadow.db || echo "DB not found"

      - name: Diagnose
        if: inputs.action == 'diagnose' || inputs.action == 'all'
        run: python tools/emergency_audit.py

      - name: DIP_BUY check
        if: inputs.action == 'dip_check' || inputs.action == 'all'
        run: python tools/emergency_dip_check.py
        continue-on-error: true

      - name: Multi-Day check
        if: inputs.action == 'multiday_check' || inputs.action == 'all'
        run: python tools/emergency_multiday_check.py
        continue-on-error: true

      - name: Cleanup DB
        if: inputs.action == 'cleanup' || inputs.action == 'all'
        run: python tools/emergency_cleanup.py

      - name: Post-cleanup audit
        if: inputs.action == 'cleanup' || inputs.action == 'all'
        run: python tools/emergency_audit.py

      - name: Commit & push DB
        if: inputs.action == 'cleanup' || inputs.action == 'all'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/shadow.db shadow_results.csv
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🧹 Emergency cleanup: reset non-BUY outcome_status [skip ci]"
            git push
          fi

      - name: Show DB size after
        if: always()
        run: ls -lh data/shadow.db || echo "DB not found"
