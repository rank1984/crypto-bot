name: Reset Legacy Preview (DRY RUN)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: DRY RUN — preview what would be reset
        env:
          DB_PATH: data/shadow.db
          DRY_RUN: "YES"
          MAX_AGE_HOURS: "168"
        run: python -m tools.reset_legacy_finals
